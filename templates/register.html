{% extends "base.html" %}

{% block title %}ثبت‌نام و تایید ایمیل | زیرنویسا{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-8 sm:py-16">
    <div id="register-box" 
         class="glass-card rounded-2xl sm:rounded-[2rem] p-6 sm:p-10 border border-slate-200 dark:border-white/10 relative overflow-hidden shadow-2xl noise-overlay animate-fade-in-scale"
         x-data="{ isSubmitting: false }">

        <!-- Decorative accent -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-purple-500/10 dark:bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="text-center mb-8 relative z-10">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-emerald-500/15 to-teal-500/15 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-center mb-4 shadow-lg shadow-emerald-500/10">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-black text-slate-800 dark:text-white">ساخت حساب کاربری</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-2">کد تایید یکبار مصرف به ایمیل شما ارسال خواهد شد</p>
        </div>

        <div id="register-error-container" class="relative z-10"></div>

        <form hx-post="/auth/send-otp/"
              hx-target="#register-box"
              hx-swap="innerHTML"
              @submit="isSubmitting = true"
              @htmx:after-request="isSubmitting = false"
              class="space-y-5 relative z-10">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2">نام کاربری</label>
                <input type="text" 
                       name="username" 
                       required 
                       placeholder="حداقل ۳ کاراکتر انگلیسی"
                       class="glass-input w-full px-4 py-3.5 rounded-2xl text-sm placeholder-slate-400 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2">آدرس ایمیل</label>
                <input type="email" 
                       name="email" 
                       required 
                       placeholder="name@example.com"
                       class="glass-input w-full px-4 py-3.5 rounded-2xl text-sm placeholder-slate-400 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2">رمز عبور</label>
                <input type="password" 
                       name="password" 
                       required 
                       placeholder="حداقل ۶ کاراکتر"
                       class="glass-input w-full px-4 py-3.5 rounded-2xl text-sm placeholder-slate-400 focus:outline-none">
            </div>

            <button type="submit" 
                    :disabled="isSubmitting"
                    :class="{ 'opacity-50 cursor-not-allowed !transform-none': isSubmitting }"
                    class="btn-primary w-full py-4 rounded-2xl text-white font-bold text-sm shadow-xl shadow-red-500/25 flex items-center justify-center gap-2 mt-3">
                <span x-show="!isSubmitting" class="flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    ارسال کد تایید به ایمیل
                </span>
                <span x-show="isSubmitting" class="flex items-center gap-2" style="display: none;">
                    <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    در حال اتصال و ارسال ایمیل...
                </span>
            </button>
        </form>

        <div class="mt-7 text-center text-xs text-slate-500 dark:text-slate-400 relative z-10">
            قبلاً ثبت‌نام کرده‌اید؟ 
            <a href="/login/" class="text-red-600 dark:text-red-400 hover:underline font-bold mr-1">وارد شوید</a>
        </div>
    </div>
</div>
{% endblock %}
