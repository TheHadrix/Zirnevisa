<!-- Step 2: OTP Verification Component (Django Template) -->
<div x-data="{
    timer: 120,
    timerText: '02:00',
    canResend: false,
    interval: null,
    isVerifying: false,
    init() {
        this.startTimer();
    },
    startTimer() {
        this.timer = 120;
        this.canResend = false;
        if (this.interval) clearInterval(this.interval);
        this.interval = setInterval(() => {
            if (this.timer > 0) {
                this.timer--;
                let m = Math.floor(this.timer / 60);
                let s = this.timer % 60;
                this.timerText = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
            } else {
                this.canResend = true;
                clearInterval(this.interval);
            }
        }, 1000);
    }
}" x-init="init()">

    <div class="text-center mb-6">
        <div class="w-12 h-12 mx-auto rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center mb-3">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
        </div>
        <h2 class="text-2xl font-black text-slate-800 dark:text-white">تایید آدرس ایمیل</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5 leading-relaxed">
            کد تایید ۶ رقمی به ایمیل <span class="text-indigo-600 dark:text-indigo-400 font-bold dir-ltr inline-block">{{ email }}</span> ارسال شد.
        </p>
    </div>

    <!-- Alert / Response Container -->
    <div id="otp-error-container">
        <div class="p-3 bg-emerald-500/15 border border-emerald-500/30 text-emerald-600 dark:text-emerald-300 rounded-xl text-xs mb-4 text-center font-semibold">
            کد تایید ارسال شد. لطفاً صندوق ورودی (یا اسپم) خود را بررسی کنید.
        </div>
    </div>

    <form hx-post="/auth/verify-otp/"
          hx-target="#otp-error-container"
          hx-swap="innerHTML"
          @submit="isVerifying = true"
          @htmx:after-request="isVerifying = false"
          class="space-y-5">
        {% csrf_token %}

        <input type="hidden" name="email" value="{{ email }}">

        <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2 text-center">کد ۶ رقمی دریافتی</label>
            <input type="text" 
                   name="otp_code" 
                   required 
                   maxlength="6"
                   placeholder="123456" 
                   autofocus
                   autocomplete="one-time-code"
                   class="glass-input w-full px-4 py-3.5 rounded-2xl text-center text-2xl font-mono tracking-widest text-indigo-600 dark:text-indigo-400 placeholder-slate-400 focus:outline-none shadow-inner">
        </div>

        <button type="submit" 
                :disabled="isVerifying"
                :class="{ 'opacity-50 cursor-not-allowed': isVerifying }"
                class="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm shadow-xl shadow-indigo-600/25 transition-all flex items-center justify-center gap-2">
            <span x-show="!isVerifying">تایید و ورود به حساب</span>
            <span x-show="isVerifying" class="flex items-center gap-2" style="display: none;">
                <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                در حال بررسی کد...
            </span>
        </button>
    </form>

    <!-- Resend OTP & Countdown -->
    <div class="mt-6 pt-4 border-t border-slate-200 dark:border-white/10 flex items-center justify-between text-xs">
        <div class="text-slate-500 dark:text-slate-400">
            <span x-show="!canResend">
                ارسال مجدد کد تا: <span class="font-mono font-bold text-indigo-600 dark:text-indigo-400" x-text="timerText"></span>
            </span>
            <span x-show="canResend" class="text-amber-500 font-bold" style="display: none;">
                کد را دریافت نکردید؟
            </span>
        </div>

        <form hx-post="/auth/resend-otp/"
              hx-target="#otp-error-container"
              hx-swap="innerHTML"
              @htmx:after-request="startTimer()">
            {% csrf_token %}
            <input type="hidden" name="email" value="{{ email }}">
            <button type="submit" 
                    :disabled="!canResend"
                    :class="{ 'opacity-40 cursor-not-allowed text-slate-400': !canResend, 'text-indigo-600 dark:text-indigo-400 hover:underline font-bold': canResend }"
                    class="transition-colors">
                ارسال مجدد کد
            </button>
        </form>
    </div>
</div>
