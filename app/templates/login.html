{% extends "base.html" %}

{% block title %}ورود به حساب کاربری | زیرنویسا{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="glass-card rounded-3xl p-8 border border-white/10 relative overflow-hidden shadow-2xl">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-black text-white">ورود به حساب</h2>
            <p class="text-xs text-slate-400 mt-1.5">به حساب زیرنویسا خود وارد شوید</p>
        </div>

        <div id="login-error-container"></div>

        <form hx-post="/auth/login"
              hx-target="#login-error-container"
              hx-swap="innerHTML"
              class="space-y-4">

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">نام کاربری یا ایمیل</label>
                <input type="text" 
                       name="username_or_email" 
                       required 
                       placeholder="مثلاً: user یا user@example.com"
                       class="glass-input w-full px-4 py-3 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">رمز عبور</label>
                <input type="password" 
                       name="password" 
                       required 
                       placeholder="••••••••"
                       class="glass-input w-full px-4 py-3 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none">
            </div>

            <button type="submit" 
                    class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm shadow-lg shadow-indigo-500/25 transition-all mt-2">
                ورود به سامانه
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            حساب کاربری ندارید؟ 
            <a href="/register" class="text-indigo-400 hover:text-indigo-300 font-semibold underline mr-1">ثبت‌نام کنید</a>
        </div>
    </div>
</div>
{% endblock %}
