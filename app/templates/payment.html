{% extends "base.html" %}

{% block title %}درگاه پرداخت امن شبیه‌سازی شده | زیرنویسا{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-12">
    <!-- Bank Gateway Container -->
    <div class="bg-[#0f172a] rounded-3xl border border-white/10 shadow-2xl overflow-hidden">
        
        <!-- Gateway Header (Shaparak Style Mockup) -->
        <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 p-6 border-b border-white/10 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-lg">
                    💳
                </div>
                <div>
                    <h3 class="font-black text-white text-base">درگاه پرداخت الکترونیک</h3>
                    <span class="text-[11px] text-slate-400">شبیه‌ساز پرداخت ایمن شاپرک</span>
                </div>
            </div>
            <span class="px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-[11px] font-bold border border-emerald-500/30">
                محیط تستی
            </span>
        </div>

        <!-- Order Summary -->
        <div class="p-6 bg-white/[0.02] border-b border-white/5">
            <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                <span>پذیرنده:</span>
                <span class="font-bold text-slate-200">سرویس هوشمند زیرنویسا</span>
            </div>
            <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                <span>محصول:</span>
                <span class="text-slate-200">اشتراک ۳۰ روزه ویژه (VIP)</span>
            </div>
            <div class="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-white/5">
                <span>مبلغ قابل پرداخت:</span>
                <span class="text-xl font-black text-amber-400">{{ amount }} <span class="text-xs font-normal text-slate-400">تومان</span></span>
            </div>
        </div>

        <!-- Fake Form Input Fields -->
        <div class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">شماره کارت مجازی</label>
                <input type="text" 
                       value="۶۰۳۷ - ۹۹۱۴ - ۱۲۳۴ - ۵۶۷۸" 
                       disabled 
                       class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-slate-400 font-mono text-center tracking-widest cursor-not-allowed">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">کد CVV2</label>
                    <input type="text" 
                           value="۷۸۹" 
                           disabled 
                           class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-slate-400 font-mono text-center cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">تاریخ انقضا</label>
                    <input type="text" 
                           value="۰۵ / ۰۸" 
                           disabled 
                           class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-slate-400 font-mono text-center cursor-not-allowed">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">رمز دوم / رمز پویا</label>
                <div class="flex gap-2">
                    <input type="text" 
                           value="۱۲۳۴۵۶" 
                           disabled 
                           class="flex-1 bg-slate-900 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-slate-400 font-mono text-center cursor-not-allowed">
                    <button type="button" class="px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-xs text-slate-300">
                        دریافت رمز
                    </button>
                </div>
            </div>
        </div>

        <!-- Form Submission Actions -->
        <form action="/payment/process" method="POST" class="p-6 bg-slate-950/60 border-t border-white/10 flex flex-col sm:flex-row gap-3">
            <button type="submit" 
                    name="action" 
                    value="success"
                    class="flex-1 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-xs shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                پرداخت موفق (شبیه‌سازی و فعال‌سازی اشتراک)
            </button>

            <button type="submit" 
                    name="action" 
                    value="cancel"
                    class="py-3 px-5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white font-semibold text-xs border border-white/10 transition-all">
                انصراف
            </button>
        </form>

    </div>
</div>
{% endblock %}
